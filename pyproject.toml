[project]
name = "josh_coaching"
authors = [
    { name = "Josh Enterprises", email = "admin@example.com" }
]
description = "Coaching & Training Center suite (sports, dance, gymnastics, academics) for Frappe v15 + ERPNext v15: students, staff, batches, sessions, QR attendance, fee collection with gateway payments and receipts."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
gateways = [
    "razorpay>=1.4",
    "stripe>=9.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
