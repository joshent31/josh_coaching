{% extends "templates/web.html" %}

{% block title %}{{ _("My Coaching Portal") }}{% endblock %}

{% block page_content %}
<div class="coaching-portal">
  <h3 class="mb-4">{{ _("My Coaching Portal") }}</h3>

  <div id="portal-loading" class="text-muted">Loading…</div>

  <div id="portal-content" style="display:none;">
    <div id="student-cards"></div>

    <ul class="nav nav-tabs mt-4" role="tablist">
      <li class="nav-item"><a class="nav-link active" data-toggle="tab" href="#tab-sessions">{{ _("Upcoming Sessions") }}</a></li>
      <li class="nav-item"><a class="nav-link" data-toggle="tab" href="#tab-fees">{{ _("Fees") }}</a></li>
      <li class="nav-item"><a class="nav-link" data-toggle="tab" href="#tab-qr">{{ _("My QR Pass") }}</a></li>
    </ul>

    <div class="tab-content mt-3">
      <div class="tab-pane fade show active" id="tab-sessions">
        <div id="sessions-list"></div>
      </div>
      <div class="tab-pane fade" id="tab-fees">
        <div id="invoices-list"></div>
      </div>
      <div class="tab-pane fade" id="tab-qr">
        <div id="qr-pass"></div>
      </div>
    </div>
  </div>
</div>

<style>
.coaching-portal .card { border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 12px; }
.coaching-portal .badge-paid { background: #29CD42; }
.coaching-portal .badge-overdue { background: #E44258; }
.coaching-portal .badge-partially { background: #ECAD4B; }
</style>
{% endblock %}
